name: Auto Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get version
      id: get_version
      run: |
        echo "Fetching version from .csproj"
        CSPROJ_FILE=$(find . -name "SearXSharp.csproj" -not -path "*/tests/*" -not -path "*/benchmarks/*" | head -n 1)
        VERSION=$(grep -oP '<Version>\K[^<]+' $CSPROJ_FILE || grep -oP '<VersionPrefix>\K[^<]+' $CSPROJ_FILE)
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "version=$VERSION" >> $GITHUB_OUTPUT

  release:
    needs: check-release
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build project
      run: dotnet build --configuration Release --no-restore

    - name: Create NuGet package
      run: dotnet pack --configuration Release --no-build --output nupkg

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ needs.check-release.outputs.version }}
        name: SearXSharp v${{ needs.check-release.outputs.version }}
        body: |
          ## SearXSharp v${{ needs.check-release.outputs.version }}

          See [CHANGELOG](CHANGELOG.md) for details.
        files: "**/SearXSharp.${{ needs.check-release.outputs.version }}.nupkg"
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish to NuGet
      run: dotnet nuget push "**/SearXSharp.${{ needs.check-release.outputs.version }}.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
